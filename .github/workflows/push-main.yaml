name: push to main

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build library and deploy dashboard to Github Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: install elan
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- --default-toolchain none -y
          ~/.elan/bin/lean --version
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          echo "short_lean_version=$(~/.elan/bin/lean --run scripts/lean_version.lean)" >> $GITHUB_ENV

      - name: restore build cache
        id: restore-build-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: build-${{ hashFiles('lakefile.toml', 'lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            build-${{ hashFiles('lakefile.toml', 'lake-manifest.json', 'lean-toolchain') }}-
            build-${{ hashFiles('lakefile.toml', 'lake-manifest.json', 'lean-toolchain') }}

      - name: get mathlib cache
        if: steps.restore-build-cache.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: free disk space and add swap
        run: |
          {
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -a -f 2>/dev/null || true
          df -h /
          FREE_KB=$(df --output=avail / | tail -1 | tr -d ' ')
          FREE_GB=$(( FREE_KB / 1024 / 1024 ))
          SIZE_GB=$(( FREE_GB > 30 ? 20 : (FREE_GB > 14 ? FREE_GB - 10 : 4) ))
          echo "Available disk: ${FREE_GB}G; trying ${SIZE_GB}G swap"
          if sudo fallocate -l ${SIZE_GB}G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=$((SIZE_GB * 1024)); then
            sudo chmod 600 /swapfile2
            if sudo mkswap /swapfile2 && sudo swapon /swapfile2; then
              echo "swap enabled: ${SIZE_GB}G"
            else
              echo "WARNING: mkswap/swapon failed; continuing without swap"
              sudo rm -f /swapfile2 || true
            fi
          else
            echo "WARNING: could not allocate swapfile; continuing without swap"
            sudo rm -f /swapfile2 || true
          fi
          sudo sysctl vm.swappiness=10 2>/dev/null || true
          free -h
          } 2>&1 | tee /tmp/build.log
          # Push the setup log immediately so it survives a later hard kill.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin build-log || true
          git checkout -b build-log origin/build-log || git checkout -b build-log
          cp /tmp/build.log build-log.txt || echo "no build log" > build-log.txt
          git add build-log.txt
          git commit -q -m "setup log (run ${{ github.run_number }})" || true
          git push -f -q origin build-log || true
          git checkout - || true
          true

      - name: lake build
        id: build
        run: |
          set -o pipefail
          echo "Starting build at $(date +'%T')"
          # Periodic log push from a side worktree, so the build log is
          # visible even if the runner hard-kills this step (OOM).
          git worktree add /tmp/logwt build-log 2>/dev/null || git worktree add /tmp/logwt -b build-log
          (
            while true; do
              sleep 240
              cp /tmp/build.log /tmp/logwt/build-log.txt 2>/dev/null || continue
              git -C /tmp/logwt add build-log.txt 2>/dev/null || continue
              git -C /tmp/logwt -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "progress $(date +'%T')" 2>/dev/null || continue
              git -C /tmp/logwt push -q -f origin build-log 2>/dev/null || true
            done
          ) &
          PUSHER=$!
          # Memory monsters (>200KB) one at a time, big files (60-200KB) two
          # at a time, everything else four at a time.
          (
          grep -oE '^import (Compfiles\.[A-Za-z0-9]+)' Compfiles.lean | awk '{print $2}' | sort > /tmp/all_modules.txt
          find Compfiles -name '*.lean' -size +200k | sed 's|Compfiles/|Compfiles.|; s|/|.|g; s|\.lean$||' | sort > /tmp/huge_modules.txt
          find Compfiles -name '*.lean' -size +60k -size -200k | sed 's|Compfiles/|Compfiles.|; s|/|.|g; s|\.lean$||' | sort > /tmp/big_modules.txt
          comm -23 /tmp/all_modules.txt <(cat /tmp/huge_modules.txt /tmp/big_modules.txt | sort) > /tmp/small_modules.txt
          echo "huge: $(wc -l < /tmp/huge_modules.txt), big: $(wc -l < /tmp/big_modules.txt), small: $(wc -l < /tmp/small_modules.txt)"
          cat /tmp/huge_modules.txt | xargs -P1 -I{} sh -c 'lake build "+{}" || { echo "FAILED: {}"; exit 1; }' || exit 1
          echo "Huge modules done at $(date +'%T')"
          cat /tmp/big_modules.txt | xargs -P2 -I{} sh -c 'lake build "+{}" || { echo "FAILED: {}"; exit 1; }' || exit 1
          echo "Big modules done at $(date +'%T')"
          cat /tmp/small_modules.txt | xargs -P4 -I{} sh -c 'lake build "+{}" || { echo "FAILED: {}"; exit 1; }' || exit 1
          echo "All problem modules built at $(date +'%T'); building remaining targets"
          lake build
          ) 2>&1 | tee -a /tmp/build.log
          result_run1=${PIPESTATUS[0]}
          kill $PUSHER 2>/dev/null || true
          echo "Complete at $(date +'%T'); return value $result_run1"
          exit $result_run1

      - name: upload build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin build-log || true
          git checkout -b build-log origin/build-log || git checkout -b build-log
          cp /tmp/build.log build-log.txt || echo "no build log" > build-log.txt
          git add build-log.txt
          git commit -m "build log (run ${{ github.run_number }}, deleted after diagnosis)" || exit 0
          git push -f origin build-log

      - name: save build cache
        uses: actions/cache/save@v5
        with:
          path: .lake
          key: ${{ steps.restore-build-cache.outputs.cache-primary-key }}

      - name: check that Compfiles.lean is up to date
        id: check-Compfiles-lean
        run: |
          echo "Running mk_toplevel_file.bash..."
          bash ./scripts/mk_toplevel_file.bash
          echo "Checking that Compfiles.lean is unchanged..."
          echo "(If this fails, you should run ./scripts/mk_toplevel_file.bash locally.)"
          bash ./scripts/assert_working_directory_clean.bash

      - name: run extractProblems
        id: run-extractProblems
        run: |
          set -o pipefail
          echo "Starting build at $(date +'%T')"
          lake exe extractProblems
          result_run1=$?
          echo "Complete at $(date +'%T'); return value $result_run1"

      - name: run buildWebpage
        id: run-buildWebpage
        env:
          GITHUB_PAGES_BASEURL: https://imbernoulli.github.io/compfiles/
        run: |
          set -o pipefail
          echo "Starting build at $(date +'%T')"
          lake exe buildWebpage
          result_run1=$?
          echo "Complete at $(date +'%T'); return value $result_run1"


      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5